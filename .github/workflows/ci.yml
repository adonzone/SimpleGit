name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build portable zipapp
        run: |
          python scripts/build_zipapp.py
          python dist/sgit.pyz --version
      - name: Validate npm package and Python fallback
        env:
          SGIT_USE_PYTHON: "1"
        run: |
          node packaging/npm/bin/sgit.js --version
          npm pack --dry-run ./packaging/npm
